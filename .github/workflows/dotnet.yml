name: C# Build and Test

on:
  workflow_dispatch:

  push:
    branches: [ "main" ]
    paths:
      - "csharp/**"
      - ".github/workflows/dotnet.yml"

  pull_request:
    branches: [ "main" ]
    paths:
      - "csharp/**"
      - ".github/workflows/dotnet.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: csharp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore library
        run: >
          dotnet restore
          ConcurrentExclusivePack/ConcurrentExclusivePack.csproj

      - name: Restore test project
        run: >
          dotnet restore
          TestAndBenchmark/TestAndBenchmark.csproj

      - name: Build library
        run: >
          dotnet build
          ConcurrentExclusivePack/ConcurrentExclusivePack.csproj
          --configuration Release
          --no-restore

      - name: Build test project
        run: >
          dotnet build
          TestAndBenchmark/TestAndBenchmark.csproj
          --configuration Release
          --no-restore

      - name: Validate command-line entry
        run: >
          dotnet run
          --project TestAndBenchmark/TestAndBenchmark.csproj
          --configuration Release
          --no-build
          --
          --help
