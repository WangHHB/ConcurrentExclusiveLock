name: C# Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: csharp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ConcurrentExclusivePack.sln

      - name: Build
        run: >
          dotnet build ConcurrentExclusivePack.sln
          --configuration Release
          --no-restore

      - name: Run correctness tests
        run: >
          dotnet run
          --project TestAndBenchmark/TestAndBenchmark.csproj
          --configuration Release
          --no-build
          --
          correctness
